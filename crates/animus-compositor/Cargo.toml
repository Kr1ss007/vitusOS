[package]
name = "animus-compositor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "vitusos-compositor"
path = "src/main.rs"

[[bin]]
name = "vitusos-session"
path = "src/session.rs"

[[bin]]
name = "vitusos-simulation"
path = "src/simulation.rs"

[dependencies]
vitusos-installer = { path = "../vitusos-installer" }
animus-physics.workspace = true
animus-core.workspace = true
animus-render.workspace = true
animus-input.workspace = true
animus-cache.workspace = true
animus-hev.workspace = true
animus-appkit.workspace = true
tokio.workspace = true
parking_lot.workspace = true
calloop.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

# Compositor Engine — Linux bare-metal dependencies
[target.'cfg(target_os = "linux")'.dependencies]
smithay.workspace = true
wayland-server.workspace = true
wayland-protocols.workspace = true
calloop-wayland-source.workspace = true
drm.workspace = true
drm-fourcc.workspace = true
gbm.workspace = true
input.workspace = true
nix.workspace = true
ash.workspace = true
shaderc.workspace = true
pam = { workspace = true, optional = true }

[features]
default = []
pam-auth = ["pam"]

