[workspace]
resolver = "2"
members = [
    "crates/animus-physics",
    "crates/animus-core",
    "crates/animus-hev",
    "crates/animus-render",
    "crates/animus-input",
    "crates/animus-cache",
    "crates/animus-compositor",
    "crates/vitusos-native",
    "crates/vitusos-installer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["vitusOS Core Architecture Team"]
license = "Proprietary"
repository = "https://github.com/vitusOS/vitusos"

[workspace.dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.40", features = ["full"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Cryptography & Security
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
subtle = "2.6"

# Serialization & Database
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
dirs = "5.0"
zbus = { version = "5.1", default-features = false, features = ["tokio"] }
nix = { version = "0.29", default-features = false, features = ["process", "signal", "fs", "term"] }

# ── Wayland Compositor Engine (Smithay) ────────────────────────────────────────
# Smithay handles: Wayland protocol machinery, DRM/KMS output, xdg_shell, seat/input
# Our custom Vulkan pipeline handles: all actual pixel compositing
smithay = { version = "0.6", default-features = false, features = [
    "wayland_frontend",   # wl_compositor, wl_surface, wl_buffer
    "backend_drm",        # DRM/KMS output backend (bare metal)
    "backend_gbm",        # GBM buffer allocation (DRM scanout)
    "backend_egl",        # EGL context for Vulkan surface import
    "backend_winit",      # Winit backend for WSL2/development testing
    "backend_libinput",   # libinput keyboard/mouse/touch events
    "wayland_protocols",  # xdg_shell, xdg_decoration, linux_dmabuf
    "xwayland",           # XWayland support for legacy X11 apps
    "renderer_gles",      # GLES2 fallback renderer
    "use_system_lib",     # Link against system libwayland, libdrm
] }
wayland-server = { version = "0.31", features = ["log"] }
wayland-protocols = { version = "0.32", features = ["server"] }
drm = { version = "0.14", features = ["use_bindgen"] }
drm-fourcc = "2.2"
gbm = { version = "0.15", features = ["drm-support"] }
input = { version = "0.9", features = ["libinput_1_21"] }

# ── Vulkan GPU Pipeline (ash — raw Vulkan bindings) ────────────────────────────
# ash provides zero-overhead raw Vulkan. We call vkCreateInstance, vkCreateDevice,
# vkCreateGraphicsPipeline, vkCmdDraw, etc. directly.
ash = { version = "0.38", features = ["linked"] }
shaderc = "0.8"   # Runtime GLSL→SPIR-V compiler for loading shaders/*.vert/*.frag

# ── Authentication ─────────────────────────────────────────────────────────────
pam = "0.8"

# Math & Color
glam = { version = "0.29", features = ["serde"] }

# Typography & Font Rendering
ttf-parser = "0.25"
fontdue = "0.9"

# Internal Crate References
animus-physics = { path = "crates/animus-physics" }
animus-core = { path = "crates/animus-core" }
animus-hev = { path = "crates/animus-hev" }
animus-render = { path = "crates/animus-render" }
animus-input = { path = "crates/animus-input" }
animus-cache = { path = "crates/animus-cache" }
