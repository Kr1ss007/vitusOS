  <circle cx="2800" cy="650" r="760" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" fill="none"/>
  <circle cx="1100" cy="1600" r="540" stroke="#007AFF" stroke-width="1" stroke-opacity="0.12" fill="none"/>
