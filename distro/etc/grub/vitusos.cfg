# ==============================================================================
# vitusOS GRUB Configuration Fragment
# Hardware: HP Victus 15-fa2xxx | Intel i5-13420H | NVIDIA RTX 3050 (PRIME)
#           Intel UHD (i915, eDP-1 internal display) + NVIDIA GA107BM (render)
#
# Design principles:
#   - Zero text on screen from GRUB onwards (loglevel=0, quiet)
#   - Zero framebuffer console (fbcon=map:99 routes fbcon to non-existent VT)
#   - Zero virtual terminal cursor (vt.global_cursor_default=0)
#   - VT handoff slot 7 pre-allocated for compositor (vt.handoff=7)
#   - NVIDIA DRM Kernel Modesetting REQUIRED for PRIME sync (nvidia-drm.modeset=1)
#   - Intel i915 FastBoot enabled (no mode re-negotiation from BIOS mode)
#   - ACPI OS string for HP firmware compatibility
#   - rd.udev.log_level=3: suppress udev probe messages
#   - systemd.show_status=0: suppress systemd boot status bar
#   - rd.systemd.show_status=0: suppress initramfs systemd boot status
# ==============================================================================

GRUB_DEFAULT=0
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_DISTRIBUTOR="vitusOS"
GRUB_GFXMODE=1920x1080x32
GRUB_GFXPAYLOAD_LINUX=keep

# Silent boot cmdline — every parameter is required for zero-text guarantee
GRUB_CMDLINE_LINUX_DEFAULT="\
quiet \
splash \
loglevel=0 \
vt.global_cursor_default=0 \
vt.handoff=7 \
fbcon=map:99 \
fbcon=nodefer \
rd.udev.log_level=3 \
udev.log_level=3 \
systemd.show_status=0 \
rd.systemd.show_status=0 \
systemd.log_level=err \
logo.nologo \
console=ttyS0,115200n8 \
nvidia-drm.modeset=1 \
nvidia-drm.fbdev=1 \
i915.fastboot=1 \
i915.modeset=1 \
drm.debug=0 \
amdgpu.modeset=1 \
acpi_osi=Linux \
acpi_backlight=native \
pcie_aspm=off \
"

# Full cmdline for non-live installs (root= appended by grub-mkconfig)
GRUB_CMDLINE_LINUX=""

# Disable recovery menu entries — vitusOS uses CrashVault instead
GRUB_DISABLE_RECOVERY=true

# Disable OS prober — vitusOS is not a multi-boot distro
GRUB_DISABLE_OS_PROBER=true

# GRUB terminal: framebuffer only (no text console)
GRUB_TERMINAL_OUTPUT=gfxterm
GRUB_BACKGROUND=""
