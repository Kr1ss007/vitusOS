# ==============================================================================
# vitusOS Silent Kernel Sysctl Configuration
# Hardware: HP Victus 15 | Intel i5-13420H | NVIDIA RTX 3050 + Intel UHD PRIME
#
# Goals:
#   - Suppress all kernel ring buffer output to console (printk off at runtime)
#   - Disable kernel sysrq key (security + zero spurious console output)
#   - Minimize network namespace noise
#   - NVIDIA and DRM memory management tuning
# ==============================================================================

# ── Kernel Printk Console Suppression ─────────────────────────────────────────
# Format: console_loglevel default_message_loglevel minimum_console_loglevel default_console_loglevel
# Setting all to 0 = absolute silence on all consoles at runtime.
# The AnimusBoot UEFI + animus-early handle pre-OS display; systemd journal
# handles post-boot diagnostic capture without any console output.
kernel.printk = 0 0 0 0

# Disable kernel sysrq (no magic key sequences printed to console)
kernel.sysrq = 0

# ── Memory Management ────────────────────────────────────────────────────────
# Disable memory overcommit logging
vm.overcommit_memory = 1

# Aggressive page reclaim (keep VRAM-bound workloads smooth)
vm.swappiness = 10

# Limit dirty writeback latency to prevent frame stutter from writeback storms
vm.dirty_ratio = 5
vm.dirty_background_ratio = 2
vm.dirty_writeback_centisecs = 100
vm.dirty_expire_centisecs = 500

# ── DRM / GPU Memory ─────────────────────────────────────────────────────────
# Disable DRM debug output to console (belt-and-suspenders alongside loglevel=0)
dev.drm.debug = 0

# ── Network ──────────────────────────────────────────────────────────────────
# Suppress connection refused ICMP messages from polluting dmesg
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ── Real-Time Compositor ─────────────────────────────────────────────────────
# Allow real-time scheduling for compositor thread (SCHED_RR)
kernel.sched_rt_runtime_us = -1
