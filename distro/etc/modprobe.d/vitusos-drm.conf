# ==============================================================================
# vitusOS DRM / GPU Kernel Module Configuration
# Hardware: HP Victus 15 | Intel i5-13420H (Raptor Lake-P)
#           Primary Render: NVIDIA GeForce RTX 3050 6GB Laptop GPU (GA107BM)
#           Display Output: Intel UHD Graphics (i915, eDP-1) via PRIME Sync
#
# Boot sequence:
#   AnimusBoot (UEFI GOP) → animus-early (simpledrm/efifb)
#     → i915 takes eDP-1 → NVIDIA DRM modesetting → compositor (PRIME offload)
#
# NVIDIA PRIME Sync on this laptop:
#   - i915 owns the physical display (card1, eDP-1)
#   - nvidia renders frames (card2, renderD129)
#   - DRM PRIME sync links the two for tear-free presentation
# ==============================================================================

# ── NVIDIA Proprietary Driver (nvidia 595.84) ─────────────────────────────────

# REQUIRED: Kernel Modesetting — without this PRIME sync does not work
# and the compositor cannot get a DRM master lease for the NVIDIA device.
options nvidia_drm modeset=1 fbdev=1

# NVIDIA UVM: Suppress probe messages
options nvidia_uvm uvm_perf_prefetch_enable=0

# NVIDIA: Disable power management debug noise
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_EnableGpuFirmware=0
options nvidia NVreg_DynamicPowerManagement=0x02
options nvidia NVreg_UsePageAttributeTable=1
options nvidia NVreg_InitializeSystemMemoryInBug2535471=1

# ── Intel i915 (Raptor Lake-P UHD, eDP-1 display controller) ─────────────────

# FastBoot: reuse BIOS-set mode (eliminates POST-to-desktop mode flicker)
options i915 fastboot=1

# Force eDP panel mode (prevents i915 from re-negotiating EDID on boot)
options i915 force_probe=!

# Disable framebuffer console on i915 (handled by fbcon=map:99 in cmdline,
# belt-and-suspenders here at driver load time)
options i915 enable_fbc=1
options i915 enable_psr=1
options i915 enable_psr2_sel_fetch=1

# Disable i915 verbose error output
options i915 verbose_checks=0
