# ==============================================================================
# vitusOS Kernel Module Blacklist
# Hardware: HP Victus 15 | Intel i5-13420H | NVIDIA RTX 3050 + Intel UHD PRIME
#
# Rules:
#   - Blacklist ALL legacy/generic framebuffer drivers that could race with
#     AnimusBoot's GOP framebuffer or animus-early's simpledrm takeover.
#   - Blacklist Nouveau (open-source NVIDIA replacement) — vitusOS uses
#     the proprietary NVIDIA driver (595.84) exclusively for RTX 3050.
#   - Blacklist legacy sound modules that conflict with PipeWire.
# ==============================================================================

# ── Legacy Framebuffer Drivers ────────────────────────────────────────────────
# These drivers fight over the EFI framebuffer set by AnimusBoot GOP.
# Any one of these binding first would cause a white flash / mode change.
blacklist vesafb
blacklist vga16fb
blacklist efifb
blacklist simplefb

# ── Nouveau (Open-Source NVIDIA Replacement) ──────────────────────────────────
# MUST be blacklisted; if nouveau loads before nvidia_drm, PRIME sync
# initialization fails and the compositor cannot acquire DRM master.
blacklist nouveau
blacklist lbm-nouveau
options nouveau modeset=0

# ── Legacy ACPI Video Driver ──────────────────────────────────────────────────
# Replaced by native NVIDIA and i915 backlight control on this laptop.
# acpi_video binding first causes backlight enumeration conflicts.
blacklist acpi_cpufreq
blacklist psmouse

# ── Conflicting Audio Modules ─────────────────────────────────────────────────
# PipeWire manages all audio. These legacy OSS/ALSA wrappers are unused
# and emit probe errors on HP Victus that appear in dmesg.
blacklist pcspkr
blacklist snd_pcsp
